[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libpa-text"
version = "0.1.0"
description = "Native LLVM-compiled fuzzy text matching and hashing kernels for Python and Pa"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["python"]
include = ["libpa*"]

[tool.setuptools.package-data]
"libpa.text" = ["*.so", "*.pyd", "*.pyi", "py.typed"]
